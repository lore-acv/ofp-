<!--
  CESSNA C172 FR — MANUALE D'USO SFOGLIABILE

  Il manuale SOP (data/manuale.pdf, costruito da tools/manuale.mjs) letto come
  un libro: doppia pagina su schermo largo, pagina singola su telefono, girata
  animata, indice laterale con i numeri di pagina e i collegamenti dell'indice
  stampato cliccabili anche qui.

  L'indice viene da data/manuale.json, scritto dallo stesso build che
  impagina il PDF: i numeri sono quelli veri del PDF, non una copia a mano.

  La pagina vive da sola (manuale.html#p=12 o manuale.html#s3-2 portano dritti
  a una pagina o a una sezione) e dentro la pagina di import, in un riquadro
  sopra tutto il resto (?embed=1): li' "Close" chiede alla pagina madre di
  chiudere, cosi' NavLog e briefing gia' caricati non si perdono.

  Le pagine si disegnano su <canvas> con pdf.js, come faceva la guida: su iPad
  Safari un PDF in un iframe lo mostra a meta' o non lo mostra.
-->

    document.documentElement.setAttribute('data-tema', t);
  }catch(e){ document.documentElement.setAttribute('data-tema','scuro'); }
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }</script>
<script>
"use strict";
const PDF_URL='data/manuale.pdf', TOC_URL='data/manuale.json';
const EMBED=new URLSearchParams(location.search).has('embed');
const MOTO=!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

let pdf=null, N=0, ASPETTO=595/842;
let TOC=[];                     // [{level,num,title,id,page}]
let modo='spread';              // 'spread' due pagine, 'single' una
let cur=1;                      // pagina di riferimento (la sinistra, o la sola)
let anim=null;                  // girata in corso
let misura={w:0,h:0};           // dimensione in CSS px di UNA pagina
let scelta=null;                // voce dell'indice appena scelta: resta evidenziata finche' la si vede

/* ------------------------------------------------------------------ pagine */
/* Una doppia pagina e' [sinistra, destra]: la copertina sta da sola a destra,
   poi 2-3, 4-5 … come in un libro vero. */
const doppia=(p)=> p<=1 ? [0,1] : (p%2===0 ? [p, p+1<=N ? p+1 : 0] : [p-1, p]);
const vista=(p)=> modo==='spread' ? doppia(p) : [0,p];
const prima=(p)=> { const v=vista(p); return v[0]||v[1]; };
const ultima=(p)=> { const v=vista(p); return v[1]||v[0]; };

/* Pagine disegnate: poche in memoria, una pagina A4 a schermo pieno su iPad
   e' qualche megabyte. */
const CACHE=new Map(), CACHE_MAX=10;
async function disegna(n){
  const dpr=Math.min(window.devicePixelRatio||1, 2.5);
  const key=n+'@'+Math.round(misura.w*dpr);
  if(CACHE.has(key)){ const c=CACHE.get(key); CACHE.delete(key); CACHE.set(key,c); return c; }
  const pg=await pdf.getPage(n);
  const base=pg.getViewport({scale:1});
  const vp=pg.getViewport({scale:(misura.w*dpr)/base.width});
  const c=document.createElement('canvas');
  c.width=Math.round(vp.width); c.height=Math.round(vp.height);
  c.setAttribute('role','img'); c.setAttribute('aria-label',`Page ${n} of ${N}`);
  await pg.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
  CACHE.set(key,c);
  while(CACHE.size>CACHE_MAX) CACHE.delete(CACHE.keys().next().value);
  return c;
}
function copia(c){
  const d=document.createElement('canvas'); d.width=c.width; d.height=c.height;
  d.getContext('2d').drawImage(c,0,0); return d;
}

/* I collegamenti del PDF (l'indice stampato, i rimandi dell'appendice)
   diventano zone cliccabili sopra la pagina. */
const LINK=new Map();
async function linkDi(n){
  if(LINK.has(n)) return LINK.get(n);
  const pg=await pdf.getPage(n), vp=pg.getViewport({scale:1});
  const out=[];
  for(const a of await pg.getAnnotations()){
    if(a.subtype!=='Link' || !a.dest) continue;
    try{
      const dest=typeof a.dest==='string' ? await pdf.getDestination(a.dest) : a.dest;
      if(!dest) continue;
      const to=await pdf.getPageIndex(dest[0])+1;
      const [x1,y1,x2,y2]=vp.convertToViewportRectangle(a.rect);
      out.push({to, l:Math.min(x1,x2)/vp.width, t:Math.min(y1,y2)/vp.height,
                w:Math.abs(x2-x1)/vp.width, h:Math.abs(y2-y1)/vp.height});
    }catch(e){}
  }
  LINK.set(n,out); return out;
}

async function riempi(slot, n){
  slot.innerHTML='';
  slot.classList.toggle('vuota', !n);
  slot.dataset.n=n||'';
  if(!n) return;
  slot.innerHTML='<div class="fb-carica">…</div>';
  const c=await disegna(n);
  if(slot.dataset.n!==String(n)) return;          // nel frattempo si e' andati altrove
  slot.innerHTML=''; slot.appendChild(c);
  for(const k of await linkDi(n)){
    const a=document.createElement('a');
    a.className='fb-link'; a.href='#p='+k.to;
    a.setAttribute('aria-label','Go to page '+k.to);
    a.style.cssText=`left:${k.l*100}%;top:${k.t*100}%;width:${k.w*100}%;height:${k.h*100}%`;
    a.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); vai(k.to); });
    slot.appendChild(a);
  }
}

/* ------------------------------------------------------------------ misura */
function impagina(){
  const st=$('fbStage'), W=st.clientWidth-(innerWidth>640?112:16), H=st.clientHeight-24;
  const largo = W/H > 2*ASPETTO*0.82 && W>=700;
  modo = largo ? 'spread' : 'single';
  const h=Math.max(100, Math.floor(Math.min(H, (largo ? W/2 : W)/ASPETTO)));
  const w=Math.floor(h*ASPETTO);
  const cambia = w!==misura.w;
  misura={w,h};
  const b=$('fbBook');
  b.className='fb-book '+modo;
  b.style.width=(largo?2*w:w)+'px'; b.style.height=h+'px';
  return cambia;
}

/* ------------------------------------------------------------------ stato */
async function mostra(){
  const [l,r]=vista(cur);
  await Promise.all([riempi($('fbSx'), modo==='spread'?l:0), riempi($('fbDx'), r)]);
  aggiorna();
}
function aggiorna(){
  const a=prima(cur), b=ultima(cur);
  $('fbNum').value = a===b ? String(a) : `${a}–${b}`;
  $('fbScorri').value=a;
  $('fbPrev').disabled = a<=1;
  $('fbNext').disabled = b>=N;
  try{ history.replaceState(null,'','#p='+a); }catch(e){}
  // sezione corrente: l'ultima voce che comincia entro le pagine visibili
  let attuale=null;
  const sc=scelta && TOC.find(t=>t.id===scelta);
  if(sc && sc.page>=a && sc.page<=b) attuale=sc;
  else TOC.forEach(t=>{ if(t.page<=b) attuale=t; });
  document.querySelectorAll('#fbTocList a').forEach(x=>x.setAttribute('aria-current', attuale && x.dataset.id===attuale.id ? 'true':'false'));
  const s1=[...TOC].reverse().find(t=>t.level===1 && t.page<=b);
  $('fbSez').textContent = attuale ? [s1&&s1!==attuale ? (s1.num?s1.num+' · ':'')+s1.title : '', (attuale.num?attuale.num+' ':'')+attuale.title].filter(Boolean).join('  ›  ') : '';
  // le pagine vicine si preparano in anticipo
  const vicine=[b+1,b+2,a-1,a-2].filter(n=>n>=1&&n<=N);
  setTimeout(()=>vicine.forEach(n=>disegna(n).catch(()=>{})), 120);
}

/* ------------------------------------------------------------------ girata */
function faccia(cls, c){
  const f=document.createElement('div'); f.className='fb-face '+cls;
  if(c) f.appendChild(c);
  const o=document.createElement('div'); o.className='ombra'; f.appendChild(o);
  return f;
}

async function vai(p, voce){
  p=Math.max(1, Math.min(N, Math.round(p)||1));
  scelta=voce||null;
  if(anim){ anim.finish(); await anim.finished.catch(()=>{}); }
  const da=vista(cur), a=vista(p);
  if(da[0]===a[0] && da[1]===a[1]){ cur=p; aggiorna(); return; }
  const avanti = prima(p) > prima(cur);
  if(!MOTO){ cur=p; return mostra(); }

  const book=$('fbBook'), sx=$('fbSx'), dx=$('fbDx');
  const leaf=document.createElement('div'); leaf.className='fb-leaf';
  const dur=620, ease='cubic-bezier(.45,.05,.35,1)';
  let fronte, retro, finale;

  if(modo==='spread'){
    // la pagina che si gira: quella di destra andando avanti, la sinistra tornando indietro
    const vecchia = avanti ? da[1] : da[0];
    const nuova   = avanti ? a[0]  : a[1];
    const cv=vecchia ? copia(await disegna(vecchia)) : null;
    const cn=nuova   ? copia(await disegna(nuova))   : null;
    fronte=faccia('fronte', cv); retro=faccia('retro', cn);
    leaf.style.width='50%'; leaf.style.left = avanti ? '50%' : '0';
    leaf.style.transformOrigin = avanti ? 'left center' : 'right center';
    leaf.append(fronte, retro);
    if(!vecchia) fronte.style.visibility='hidden';
    // sotto il foglio che si alza c'e' gia' la pagina che resta scoperta
    await riempi(avanti ? dx : sx, avanti ? a[1] : a[0]);
    book.appendChild(leaf);
    const gira = avanti ? [{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}]
                        : [{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'}];
    anim=leaf.animate(gira,{duration:dur,easing:ease,fill:'forwards'});
    fronte.querySelector('.ombra').animate([{opacity:0},{opacity:.9}],{duration:dur/2,easing:'ease-in',fill:'forwards'});
    retro.querySelector('.ombra').animate([{opacity:.9},{opacity:.9,offset:.5},{opacity:0}],{duration:dur,easing:'ease-out',fill:'forwards'});
    finale=()=>riempi(avanti ? sx : dx, avanti ? a[0] : a[1]);
  }else{
    // una pagina sola: avanti la pagina si solleva e scopre la nuova; indietro la nuova si posa sopra
    const c=copia(await disegna(avanti ? cur : p));
    fronte=faccia('fronte', c);
    leaf.style.width='100%'; leaf.style.left='0'; leaf.style.transformOrigin='left center';
    leaf.append(fronte);
    if(avanti) await riempi(dx, p);
    book.appendChild(leaf);
    const k=[{transform:'rotateY(0deg)',opacity:1},{transform:'rotateY(-75deg)',opacity:1,offset:.7},{transform:'rotateY(-100deg)',opacity:0}];
    anim=leaf.animate(avanti ? k : [...k].reverse(),{duration:dur*0.85,easing:ease,fill:'forwards'});
    fronte.querySelector('.ombra').animate(avanti?[{opacity:0},{opacity:.8}]:[{opacity:.8},{opacity:0}],{duration:dur*0.85,fill:'forwards'});
    finale=()=> avanti ? null : riempi(dx, p);
  }
  cur=p; aggiorna();
  try{ await anim.finished; }catch(e){}
  await finale();
  leaf.remove(); anim=null;
}
const avanti=()=>{ const b=ultima(cur); if(b<N) vai(b+1); };
const indietro=()=>{ const a=prima(cur); if(a>1) vai(modo==='spread' ? Math.max(1,a-2) : a-1); };

/* ------------------------------------------------------------------ indice */
function costruisciIndice(){
  const ol=$('fbTocList'); ol.innerHTML='';
  TOC.forEach(t=>{
    const li=document.createElement('li');
    const a=document.createElement('a');
    a.className='l'+t.level; a.href='#'+t.id; a.dataset.id=t.id;
    a.innerHTML=`<span class="n">${esc(t.num)}</span><span class="t">${esc(t.title)}</span><span class="p">${t.page}</span>`;
    a.setAttribute('aria-label',`${t.num?t.num+' ':''}${t.title}, page ${t.page}`);
    a.addEventListener('click',e=>{
      e.preventDefault(); vai(t.page, t.id);
      if(innerWidth<=900) indice(false);
    });
    li.appendChild(a); ol.appendChild(li);
  });
}
function indice(apri){
  const m=$('fbMain');
  apri = apri===undefined ? !m.classList.contains('toc-open') : apri;
  m.classList.toggle('toc-open', apri);
  $('fbIndice').setAttribute('aria-pressed', apri?'true':'false');
  try{ localStorage.setItem('ofp_manuale_indice', apri?'1':'0'); }catch(e){}
  if(pdf && impagina()){ CACHE.clear(); mostra(); }
  if(apri){ const x=document.querySelector('#fbTocList a[aria-current="true"]'); if(x) x.scrollIntoView({block:'nearest'}); }
}

/* L'indice vero e' manuale.json; se non c'e' si ricava dai segnalibri del PDF. */
async function caricaIndice(){
  try{
    const j=await fetch(TOC_URL,{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
    if(Array.isArray(j.toc)) return j.toc;
  }catch(e){}
  const out=[], giro=async(items,level)=>{ for(const it of items||[]){
    try{ const d=typeof it.dest==='string'?await pdf.getDestination(it.dest):it.dest;
      out.push({level:Math.min(level,2), num:'', title:it.title, id:'o'+out.length, page:await pdf.getPageIndex(d[0])+1}); }catch(e){}
    if(level<2) await giro(it.items, level+1); } };
  await giro(await pdf.getOutline(), 1);
  return out;
}

/* Da dove partire: #p=12 per una pagina, #s3-2 per una sezione. */
function daHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  const m=/^p=(\d+)$/.exec(h);
  if(m) return {p:+m[1]};
  const t=TOC.find(x=>x.id===h);
  return t ? {p:t.page, id:t.id} : null;
}

/* ------------------------------------------------------------------ comandi */
$('fbNext').addEventListener('click', avanti);
$('fbPrev').addEventListener('click', indietro);
$('fbPrima').addEventListener('click', ()=>vai(1));
$('fbIndice').addEventListener('click', ()=>indice());
$('fbScrim').addEventListener('click', ()=>indice(false));
$('fbScorri').addEventListener('change', e=>vai(+e.target.value));
$('fbScorri').addEventListener('input', e=>{ $('fbNum').value=e.target.value; });
$('fbNum').addEventListener('focus', e=>e.target.select());
$('fbNum').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const n=parseInt(e.target.value,10); if(n) vai(n); e.target.blur(); } });
$('fbNum').addEventListener('blur', ()=>aggiorna());
window.addEventListener('hashchange', ()=>{ const h=daHash(); if(h && h.p!==prima(cur)) vai(h.p, h.id); });

function chiudi(){
  if(EMBED && window.parent!==window) window.parent.postMessage({tipo:'ofp-manuale-chiudi'}, location.origin);
}
if(EMBED){ $('fbChiudi').hidden=false; $('fbApp').hidden=true; }
$('fbChiudi').addEventListener('click', chiudi);

document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!e.shiftKey)){ e.preventDefault(); avanti(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||(e.key===' '&&e.shiftKey)){ e.preventDefault(); indietro(); }
  else if(e.key==='Home'){ e.preventDefault(); vai(1); }
  else if(e.key==='End'){ e.preventDefault(); vai(N); }
  else if(e.key==='Escape'){ if($('fbMain').classList.contains('toc-open') && innerWidth<=900) indice(false); else chiudi(); }
});

/* Tocco: trascinare di lato gira la pagina; un tocco sulla meta' destra va
   avanti, sulla sinistra indietro. I collegamenti hanno la precedenza. */
(function(){
  const st=$('fbStage'); let x0=null, y0=0, t0=0;
  st.addEventListener('pointerdown', e=>{ if(e.target.closest('.fb-link,.fb-nav')) return; x0=e.clientX; y0=e.clientY; t0=Date.now(); });
  st.addEventListener('pointerup', e=>{
    if(x0===null) return;
    const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.3){ dx<0 ? avanti() : indietro(); return; }
    if(Math.abs(dx)<8 && Math.abs(dy)<8 && Date.now()-t0<400){
      const b=$('fbBook').getBoundingClientRect();
      if(e.clientX<b.left || e.clientX>b.right || e.clientY<b.top || e.clientY>b.bottom) return;
      e.clientX > b.left+b.width/2 ? avanti() : indietro();
    }
  });
  st.addEventListener('pointercancel', ()=>{ x0=null; });
})();

let tRes=null;
window.addEventListener('resize', ()=>{
  clearTimeout(tRes);
  tRes=setTimeout(()=>{ if(!pdf) return; if(impagina()) CACHE.clear(); mostra(); }, 150);
});

/* ------------------------------------------------------------------ avvio */
(async function(){
  const stato=$('fbStato');
  const ripiego=(msg)=>{ stato.innerHTML=`${msg}<br><a href="${PDF_URL}">Open the manual as PDF</a>`; };
  if(!window.pdfjsLib) return ripiego('The page-turning viewer could not load.');
  try{
    pdf=await pdfjsLib.getDocument(PDF_URL).promise;
    N=pdf.numPages;
    const v=(await pdf.getPage(1)).getViewport({scale:1}); ASPETTO=v.width/v.height;
    TOC=await caricaIndice();
    costruisciIndice();
    $('fbTot').textContent='/ '+N;
    $('fbScorri').max=N;
    let aperto=innerWidth>900;
    try{ const s=localStorage.getItem('ofp_manuale_indice'); if(s!==null && innerWidth>900) aperto=s==='1'; }catch(e){}
    $('fbMain').classList.toggle('toc-open', aperto);
    $('fbIndice').setAttribute('aria-pressed', aperto?'true':'false');
    impagina();
    const h=daHash();
    cur=h ? Math.max(1,Math.min(N,h.p)) : 1; scelta=h&&h.id||null;
    stato.remove();
    await mostra();
  }catch(e){
    ripiego('Cannot open the manual ('+esc(e.message||e)+').');
  }
})();
</script>
