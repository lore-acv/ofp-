<!doctype html>
<html lang="en">
<!--
  CAMBIO PASSWORD. Obbligatorio al primo accesso e dopo un reset
  dell'amministratore (fino ad allora il server non apre nient'altro);
  facoltativo in qualunque altro momento.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151d28">
<meta name="robots" content="noindex">
<title>OFP C172 FR — Change password</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="conto.css">
<script src="conto.js"></script>

<div class="topbar"><div class="brand">C172 FR OFP <span>Account</span></div>
  <nav><a class="btn small" id="btnIndietro" href="/" hidden>&larr; Back</a>
    <button type="button" class="btn small" id="btnEsci">Sign out</button><button type="button" class="tema-btn" id="btnTema" aria-label="Toggle light / dark theme" title="Light / dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="luna" d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8Z"/><g class="sole"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2M12 19.6v2M2.4 12h2M19.6 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></g></svg></button></nav></div>
<main class="centro">
  <div class="card">
    <h1>Change password</h1>
    <p class="sub" id="sotto">Signed in as <b id="chi"></b>.</p>
    <p class="msg err" id="msg" hidden></p>
    <form id="fPassword" novalidate>
      <div class="fld"><label for="attuale" id="lAttuale">Current password</label>
        <input id="attuale" name="attuale" type="password" autocomplete="current-password" required></div>
      <div class="fld"><label for="nuova">New password</label>
        <input id="nuova" name="nuova" type="password" autocomplete="new-password" minlength="10" required></div>
      <div class="fld"><label for="nuova2">Repeat new password</label>
        <input id="nuova2" name="nuova2" type="password" autocomplete="new-password" required></div>
      <p class="hint">At least 10 characters, different from the current one. Other devices signed in with this account will be signed out.</p>
      <button type="submit" class="btn primary full">Save new password</button>
    </form>
  </div>
</main>
<script>
Conto.$('btnEsci').addEventListener('click', Conto.esci);
(async()=>{
  try{
    const io=await Conto.chiama('GET','/api/auth/io');
    Conto.$('chi').textContent=io.nome+' ('+io.email+')';
    if(io.deve_cambiare){
      Conto.$('lAttuale').textContent='Temporary password (received from the administrator)';
      Conto.$('sotto').insertAdjacentHTML('beforeend',' Before continuing, replace the temporary password with one only you know.');
    }else Conto.$('btnIndietro').hidden=false;
  }catch(e){ if(e.stato===401) location.href='/login'; }
})();
Conto.modulo('fPassword', async (d)=>{
  Conto.messaggio('msg','');
  if(d.get('nuova')!==d.get('nuova2')){ Conto.messaggio('msg','The two new passwords do not match.'); return; }
  try{
    await Conto.chiama('POST','/api/auth/password',{ attuale:d.get('attuale'), nuova:d.get('nuova') });
    Conto.messaggio('msg','Password changed.','ok');
    setTimeout(()=>{ location.href=Conto.prossima(); }, 700);
  }catch(e){ Conto.messaggio('msg', e.message); }
});
</script>
</html>
