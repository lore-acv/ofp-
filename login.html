<!doctype html>
<html lang="en">
<!--
  ACCESSO. L'unica pagina del sito raggiungibile senza sessione (con /setup).
  Gli account li crea l'amministratore: qui non c'e' registrazione.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151d28">
<meta name="robots" content="noindex">
<title>OFP C172 FR — Sign in</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="conto.css">
<script src="conto.js"></script>

<div class="topbar"><div class="brand">C172 FR OFP <span>Sign in</span></div><button type="button" class="tema-btn" id="btnTema" aria-label="Toggle light / dark theme" title="Light / dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="luna" d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8Z"/><g class="sole"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2M12 19.6v2M2.4 12h2M19.6 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></g></svg></button></div>
<main class="centro accesso">
  <section class="eroe" aria-hidden="true">
    <div class="eroe-testo">
      <div class="eroe-occhiello">REIMS ROCKET · FR172</div>
      <div class="eroe-titolo">Operational<br>Flight Plan</div>
    </div>

         con raccordi di 6 nelle virate. Senza script resta la mappa completa
         con l'aereo atterrato a DEST; con lo script l'aereo la vola (Conto.copertina). -->

      <circle class="anello" cx="240" cy="155" r="56"/><circle class="anello" cx="240" cy="155" r="136"/>

  </section>
  <div class="accesso-col">
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Use the e-mail and password provided by the administrator.</p>
    <p class="msg err" id="msg" hidden></p>
    <form id="fAccesso" novalidate>
      <div class="fld"><label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="fld"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn primary full">Sign in</button>
    </form>
  </div>
  <p class="piccolo">No account yet? Accounts are created by the administrator: contact them to request access.
    Forgotten password? The administrator can reset it.</p>
  </div>
</main>
<script>
Conto.copertina('eroeMappa');
Conto.$('email').focus();
Conto.modulo('fAccesso', async (d)=>{
  Conto.messaggio('msg','');
  try{
    const r=await Conto.chiama('POST','/api/auth/login',{ email:d.get('email'), password:d.get('password') });
    const dopo=Conto.prossima();
    location.href = r.deve_cambiare ? '/password?next='+encodeURIComponent(dopo) : dopo;
  }catch(e){
    Conto.messaggio('msg', e.message);
    Conto.$('password').value=''; Conto.$('password').focus();
  }
});
</script>
</html>
